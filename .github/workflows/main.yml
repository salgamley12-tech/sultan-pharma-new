name: Build Flutter APK (Sultan Pharma - Final Clean Pipeline)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes "y" | flutter doctor --android-licenses

      - name: Initialize and Verify Android Platform Structure
        run: |
          if [ ! -f "lib/main.dart" ]; then
            echo "Initializing standard Flutter project structure..."
            flutter create . --org com.sultanpharma --project-name sultan_pharma
          fi

          if [ ! -d "android" ]; then
            echo "Generating Android platform directory safely..."
            flutter create . --org com.sultanpharma --project-name sultan_pharma --platforms=android
          else
            echo "Android directory exists."
          fi

          mkdir -p android/gradle/wrapper

      - name: Apply Permanent Sovereign Hard-Patches
        run: |
          # 1. تثبيت Gradle 8.4 المتوافق مع Java 17
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          echo "distributionBase=GRADLE_USER_HOME" > "$GRADLE_PROP"
          echo "distributionPath=wrapper/dists" >> "$GRADLE_PROP"
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> "$GRADLE_PROP"
          echo "zipStoreBase=GRADLE_USER_HOME" >> "$GRADLE_PROP"
          echo "zipStorePath=wrapper/dists" >> "$GRADLE_PROP"

          # 2. ربط مسارات الـ SDK والـ Flutter
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

          # 3. إعدادات الذاكرة ومنع التوازي
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 4. ترقيع ملف الجذر android/build.gradle بـ AGP 8.1.1 و Kotlin 1.9.22
          ROOT_GRADLE="android/build.gradle"
          cat << 'EOF' > "$ROOT_GRADLE"
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 5. ترقيع ملف التطبيق android/app/build.gradle (Namespace, SDK 34, MultiDex, Java 17)
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              sed -i '/android {/a \    namespace "com.sultanpharma"' "$BUILD_GRADLE"
            fi
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$BUILD_GRADLE"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$BUILD_GRADLE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$BUILD_GRADLE"
            
            if ! grep -q "multiDexEnabled true" "$BUILD_GRADLE"; then
              sed -i '/defaultConfig {/a \        multiDexEnabled true' "$BUILD_GRADLE"
            fi

            if ! grep -q "compileOptions" "$BUILD_GRADLE"; then
              sed -i '/android {/a \    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = "17"\n    }' "$BUILD_GRADLE"
            fi
          fi

      - name: Get Pub Dependencies
        run: flutter pub get

      - name: Build Debug APK (Standard Flutter Pipeline)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          

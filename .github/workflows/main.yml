name: Build Flutter APK (Sultan Pharma - Ultimate Diagnostic Master)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes "y" | flutter doctor --android-licenses

      - name: Extract Project Name & Initialize Android Platform
        run: |
          PROJECT_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="sultan_pharma"
          fi
          echo "Detected Project Name: $PROJECT_NAME"
          rm -rf android ios linux macos windows web
          flutter create . --org com.sultanpharma --project-name $PROJECT_NAME --platforms=android

      - name: Hard-patch Gradle, AGP & SDK Properties for Java 17 Compatibility
        run: |
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip|g' "$GRADLE_PROP"
          fi
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Debug APK with Deep Gradle Diagnostics
        run: flutter build apk --debug --no-tree-shake-icons -- --stacktrace --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          

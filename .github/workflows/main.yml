name: Build Flutter APK (Sultan Pharma - Dual Gradle Sovereign)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes "y" | flutter doctor --android-licenses

      - name: Safe Android Platform Generation
        run: |
          PROJECT_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="sultan_pharma"
          fi
          echo "Detected Project Name: $PROJECT_NAME"

          if [ ! -d "android" ]; then
            echo "Android directory missing. Generating platform safely..."
            flutter create . --org com.sultanpharma --project-name $PROJECT_NAME --platforms=android
          else
            echo "Android directory already exists."
          fi

      - name: Comprehensive Dual-Gradle & Android Hard-Patch
        run: |
          # 1. ترقية Gradle Wrapper إلى 8.4 المتوافق مع Java 17
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip|g' "$GRADLE_PROP"
          fi

          # 2. ربط مسارات الـ SDK والـ Flutter
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

          # 3. إعدادات الذاكرة ومنع التوازي لتجنب انهيار عمال الـ Gradle
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 4. ترقيع ملف الجذر android/build.gradle لضمان توافق المستودعات و AGP 8.1.0
          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            cat << 'EOF' > "$ROOT_GRADLE"
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                      }
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          fi

          # 5. ترقيع ملف التطبيق android/app/build.gradle (Namespace, SDK 34, MultiDex)
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              sed -i '/android {/a \    namespace "com.sultanpharma"' "$BUILD_GRADLE"
            fi
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$BUILD_GRADLE"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$BUILD_GRADLE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$BUILD_GRADLE"
            
            if ! grep -q "multiDexEnabled true" "$BUILD_GRADLE"; then
              sed -i '/defaultConfig {/a \        multiDexEnabled true' "$BUILD_GRADLE"
            fi
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Debug APK with Master Precision
        run: |
          flutter build apk --debug --no-tree-shake-icons || (echo "=== BUILD FAILED, RUNNING FULL DIAGNOSTIC ===" && cd android && ./gradlew assembleDebug --no-daemon --stacktrace --info && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          


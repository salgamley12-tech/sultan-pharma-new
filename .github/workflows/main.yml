name: Build Flutter APK (Sultan Pharma - Expert Council Master)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Expert Council - Comprehensive SDK & Build-Tools Licensing
        run: |
          # القبول الشامل للرخص وتثبيت الحزم المطلوبة بما فيها 30.0.3 بدقة هندسية مطلقة
          yes "y" | flutter doctor --android-licenses
          export ANDROID_HOME=$ANDROID_HOME
          echo "Installing and licensing required Android SDK tools..."
          echo y | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;30.0.3" "platforms;android-34" "build-tools;34.0.0"
          yes "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Initialize and Verify Android Platform Structure
        run: |
          if [ ! -f "lib/main.dart" ]; then
            echo "Initializing standard Flutter project structure..."
            flutter create . --org com.sultanpharma --project-name sultan_pharma
          fi

          if [ ! -d "android" ]; then
            echo "Generating Android platform directory safely..."
            flutter create . --org com.sultanpharma --project-name sultan_pharma --platforms=android
          else
            echo "Android directory exists."
          fi

          mkdir -p android/gradle/wrapper

      - name: Expert Council - Global Hard-Patch (Gradle 8.4, AGP 8.1.1, Kotlin 1.9.22, Java 17 & Subproject Namespaces)
        run: |
          # 1. تثبيت Gradle 8.4 المتوافق مع Java 17
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          echo "distributionBase=GRADLE_USER_HOME" > "$GRADLE_PROP"
          echo "distributionPath=wrapper/dists" >> "$GRADLE_PROP"
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> "$GRADLE_PROP"
          echo "zipStoreBase=GRADLE_USER_HOME" >> "$GRADLE_PROP"
          echo "zipStorePath=wrapper/dists" >> "$GRADLE_PROP"

          # 2. ربط مسارات الـ SDK والـ Flutter
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

          # 3. إعدادات الذاكرة وإيقاف الـ Daemon لمنع الانهيار
          echo "org.gradle.daemon=false" > android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          echo "org.gradle.workers.max=1" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 4. حقن التكوينات الجذرية الشاملة لفرض Java 17 على كل الحزم الفرعية
          ROOT_GRADLE="android/build.gradle"
          cat << 'EOF' > "$ROOT_GRADLE"
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.buildDir = '../build'
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
          }

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              def pkgName = "com.sultanpharma.plugin_" + project.name.replaceAll('-', '_').toLowerCase()
                              namespace pkgName
                          }
                          compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      }
                  }
              }
          }

          subprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = '17'
                  }
              }
          }

          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # 5. ضبط التكوينات في التطبيق الرئيسي android/app/build.gradle
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            if ! grep -q "namespace" "$BUILD_GRADLE"; then
              sed -i '/android {/a \    namespace "com.sultanpharma"' "$BUILD_GRADLE"
            fi
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' "$BUILD_GRADLE"
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' "$BUILD_GRADLE"
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' "$BUILD_GRADLE"
            
            if ! grep -q "multiDexEnabled true" "$BUILD_GRADLE"; then
              sed -i '/defaultConfig {/a \        multiDexEnabled true' "$BUILD_GRADLE"
            fi

            if ! grep -q "compileOptions" "$BUILD_GRADLE"; then
              sed -i '/android {/a \    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = "17"\n    }' "$BUILD_GRADLE"
            fi
          fi

      - name: Get Pub Dependencies
        run: flutter pub get

      - name: Build Debug APK with Expert Council Verification
        run: |
          flutter build apk --debug --no-tree-shake-icons --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          

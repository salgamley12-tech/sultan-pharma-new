name: Build Flutter APK (Sultan Pharma - Sovereign Pure Master)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes "y" | flutter doctor --android-licenses

      - name: Ensure Android Directory Exists
        run: |
          # التأكد من وجود مجلد أندرويد بأسلوب آمن دون استدعاء أدوات الإنشاء المسببة للمشاكل
          if [ ! -d "android" ]; then
            echo "Error: Android directory is missing. Please ensure basic project structure is committed."
            exit 1
          fi

      - name: Inject Master SDK & Gradle Properties for Java 17
        run: |
          # 1. ترقية Gradle Wrapper إلى الإصدار 8.4 المتوافق كلياً مع Java 17
          GRADLE_PROP="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip|g' "$GRADLE_PROP"
          fi

          # 2. الربط المزدوج لـ مسار فلاتر ومسار الـ Android SDK
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

          # 3. تحسينات الذاكرة للـ JVM Daemon
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 4. ضبط minSdkVersion إلى 21
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Debug APK Successfully
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          

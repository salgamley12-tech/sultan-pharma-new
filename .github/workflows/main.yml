name: Build Flutter APK (Sultan Pharma Elite - Ultimate Master)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes "y" | flutter doctor --android-licenses

      - name: Initialize Clean Android Platform
        run: |
          rm -rf android
          flutter create . --org com.sultanpharma --project-name sultan_pharma --platforms=android

      - name: Inject Master JVM Optimizations & Force Gradle 8.4
        run: |
          # 1. ضبط الذاكرة ومشاكل الـ Daemon والترميز لقطع دابر الانهيار الصامت
          echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

          # 2. فرض استخدام إصدار Gradle 8.4 المتوافق جذرياً مع Java 17
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          # 3. ضبط minSdkVersion إلى 21
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Build Debug APK Successfully
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          

name: Build Flutter APK (Sultan Pharma Elite)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Folder Safely
        run: |
          if [ ! -d "android" ]; then
            echo "Creating temporary flutter project to extract android structure..."
            flutter create temp_project --org com.sultanpharma --project-name sultan_pharma --platforms=android
            cp -r temp_project/android ./android
            rm -rf temp_project
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Debug APK with Full Info Logs
        run: flutter build apk --debug --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sultan-Pharma-Debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
